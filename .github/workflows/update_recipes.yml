name: Update Recipes Feed

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов (4 раза в сутки: 00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:     # Поддержка ручного запуска из GitHub UI
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and normalize recipes (daily delta chunks)
        run: |
          python scripts/fetch_recipes.py

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in recipes feed."
          else
            git commit -m "chore(feed): automated daily recipe delta sync [skip ci]"
            git push
          fi
